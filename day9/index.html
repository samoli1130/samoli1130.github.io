!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carolina Football Game Day Checklist</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #87ceeb;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .checklist {
      background-color: white;
      width: 400px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #4b9cd3;
      text-align: center;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: 2px solid #4b9cd3;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      background-color: #4b9cd3;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #367eae;
    }

    ul {
      margin-top: 25px;
      padding-left: 25px;
    }

    li {
      margin: 10px 0;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="checklist">
    <h1>Carolina Football Game Day</h1>

    <div class="input-area">
      <input
        type="text"
        id="itemInput"
        placeholder="Enter an item to bring"
      >

      <button onclick="addItem()">Add Item</button>
    </div>

    <ul id="checklistItems">
      <li>Carolina jersey</li>
      <li>Tickets</li>
      <li>Phone</li>
      <li>Sunglasses</li>
    </ul>
  </div>

  <script>
    function addItem() {
      const input = document.getElementById("itemInput");
      const itemText = input.value.trim();

      if (itemText !== "") {
        const listItem = document.createElement("li");
        listItem.textContent = itemText;

        document.getElementById("checklistItems").appendChild(listItem);

        input.value = "";
        input.focus();
      }
    }

    // Allow the Enter key to add an item.
    document.getElementById("itemInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        addItem();
      }
    });
  </script>

</body>
</html>
