<!DOCTYPE html> 
<html lang="en">
   <head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Carolina Game Day Checklist</title> 
     <link rel="stylesheet" href="style.css">
     </head>
      <body> 
        <main>
           <h1>Carolina Game Day Checklist</h1>
    <form id="checklist-form">
        <label for="item-input">Item to bring:</label>
        <input
            type="text"
            id="item-input"
            name="item"
            placeholder="Enter an item"
            required
        >
        <button type="submit">Add Item to Bag</button>
    </form>

    <section aria-labelledby="items-heading">
        <h2 id="items-heading">Items to Bring</h2>

        <ul id="checklist-items">
            <li>Game ticket</li>
            <li>Carolina gear</li>
            <li>Phone</li>
        </ul>
    </section>
</main>

<script src="script.js"></script>

</body> 
</html>
