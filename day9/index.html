<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carolina Football Game Day Checklist</title>

</head>

<body>

  <div class="checklist">
    <h1>Carolina Football Game Day</h1>

    <div class="input-area">
      <input
        type="text"
        id="itemInput"
        placeholder="Enter an item to bring"
      >

      <button onclick="addItem()">Add Item</button>
    </div>

    <ul id="checklistItems">
      <li>Carolina jersey</li>
      <li>Tickets</li>
      <li>Phone</li>
      <li>Sunglasses</li>
    </ul>
  </div>
 <script src="script.js"></script>
</body>
</html>
