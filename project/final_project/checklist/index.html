<!DOCTYPE html>
<html lang="en">
<head>
    <title>Checklist Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
<h1>Assignment Checklist</h1>
 <form id="assignmentForm">
        <label for="assignmentName">Assignment Name:</label>
        <input
            type="text"
            id="assignmentName"
            name="assignmentName"
            placeholder="Enter your assignment name"
            required
        >

        <br><br>

        <label for="dueDate">Due Date:</label>
        <input
            type="date"
            id="dueDate"
            name="dueDate"
        >

        <br><br>

        <label for="className">Class:</label>
        <input
            type="text"
            id="className"
            name="className"
            placeholder="Enter your class name"
            required
        >

        <br><br>

        <button type="submit">Add Assignment</button>

    </form>

    <h2>My Assignments</h2>

    <ul id="assignmentList">
    </ul>

      <!-- Three-bar menu button -->
    <button class="menu-btn" onclick="openSidebar()">☰</button>

    <!-- Sidebar -->
    <div id="mySidebar" class="sidebar">

        <!-- Close button -->
        <a href="javascript:void(0)" class="close-btn"
           onclick="closeSidebar()">×</a>

        <!-- Three links -->
        <a href="https://samoli1130.github.io/project/final_project/index.html">Home</a>
        <a href="https://samoli1130.github.io/project/final_project/studypage/">Study Page</a>
        <a href="https://samoli1130.github.io/project/final_project/minigame/">Mini Game</a>

    </div>
    <script src="script.js"></script>
</body>
</html>
