<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Study Page Site</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
<div id="timerBox">
    <h3>Timer:</h3>
    <h3 id="timerDisplay">00:00</h3>

    <label for="minutes">Minutes:</label>
    <input type="number" id="minutes" placeholder="00" max="999" min="0">
    <br>
    <label for="seconds">Seconds:</label>
    <input type="number" id="seconds" placeholder="00" max="59" min="0">
    <br>
    
    <button id="start-btn" >Start</button>
    <button id="pause-btn">Pause</button>
    <button id="reset-btn">Reset</button>


</div>


<!-- STOPWATCH -->
<div id="stopwatch-container">

    <h3>Stopwatch:</h3>

    <div class="stopwatch-box">
        <h2 id="stopwatch-display">00:00</h2>
    </div>

    <button id="stopwatch-start">Start</button>
    <button id="stopwatch-pause">Pause</button>
    <button id="stopwatch-reset">Reset</button>

</div>


    <button class="menu-btn" onclick="openSidebar()">☰</button>

    <div id="mySidebar" class="sidebar">

        <a href="javascript:void(0)" class="close-btn"
           onclick="closeSidebar()">×</a>

        <a href="https://samoli1130.github.io/project/final_project/index.html">Home</a>
        <a href="https://samoli1130.github.io/project/final_project/studypage/">Study Page</a>
        <a href="https://samoli1130.github.io/project/final_project/minigame/">Mini Game</a>

    </div>


<!-- STUDY MUSIC PLAYER -->
<div class="music-container">

    <h1>Study Music</h1>

    <!-- Album cover -->
    <img id="music-cover" src="images/cover1.jpg"
         alt="Album cover">

    <!-- Song information -->
    <h2 id="music-title">Song 1</h2>

    <!-- Hidden audio player -->
    <audio id="study-audio"></audio>

    <!-- Music controls -->
    <div class="music-buttons">

        <button id="music-back">-15 Sec</button>

        <button id="music-play">Play</button>

        <button id="music-pause">Pause</button>

        <button id="music-forward">+15 Sec</button>

    </div>

    <!-- Song navigation -->
    <div class="music-navigation">

        <button id="music-previous">Previous Song</button>

        <button id="music-next">Next Song</button>

    </div>

</div>


        <script src="script.js"></script>
    </body>
</html>
